<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #18212b;
    color: white;
    min-height: 100vh;
    padding: 25px;
}

.app {
    width: 100%;
    max-width: 1100px;
    margin: auto;
    text-align: center;
}

h1 {
    font-size: 42px;
    margin: 10px 0;
}

.subtitle {
    color: #b8c3ce;
    margin-bottom: 25px;
}

/* COMPTEURS */

.stats {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

.stat {
    background: #263442;
    border-radius: 12px;
    padding: 12px 18px;
    font-weight: bold;
}

/* CARTES */

#cards {
    display: none;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin: 0 auto 25px;
    width: 100%;
}

.card {
    background: white;
    color: #17202a;
    border-radius: 20px;
    padding: 25px;
    min-height: 350px;
    text-align: left;
    box-shadow: 0 18px 50px rgba(0,0,0,0.45);

    animation: cardAppear 0.4s ease;
}

@keyframes cardAppear {

    from {
        opacity: 0;
        transform: scale(0.8) rotateY(90deg);
    }

    to {
        opacity: 1;
        transform: scale(1) rotateY(0);
    }

}

/* CATEGORIES */

.category {
    display: inline-block;
    border-radius: 50px;
    padding: 8px 13px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 18px;
}

.progres {
    background: #d9f7df;
    color: #176b2b;
}

.regression {
    background: #ffe0e0;
    color: #a32323;
}

.depreciation {
    background: #ffedc7;
    color: #8a5600;
}

.card-title {
    font-size: 28px;
    margin: 0 0 18px;
}

.effect {
    font-size: 17px;
    line-height: 1.6;
}

/* BOUTONS */

.controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s, opacity 0.15s;
}

button:hover {
    transform: scale(1.04);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.primary {
    background: #4ade80;
    color: #092b16;
}

.primary.big {
    font-size: 18px;
    padding: 16px 28px;
}

.secondary {
    background: #334454;
    color: white;
}

/* HISTORIQUE */

.history {
    margin: 30px auto 0;
    background: #202d39;
    border-radius: 16px;
    padding: 20px;
    text-align: left;
}

.history h2 {
    margin-top: 0;
}

.history ol {
    margin-bottom: 0;
}

.history li {
    padding: 5px 0;
    color: #d2dbe3;
}

.empty {
    color: #8795a3;
    font-style: italic;
}

/* MOBILE */

@media (max-width: 800px) {

    #cards {
        grid-template-columns: 1fr;
    }

    .card {
        min-height: auto;
    }

    h1 {
        font-size: 32px;
    }

}

</style>

/* =========================================================
   VARIABLES DU JEU
   ========================================================= */

let deck = [];
let drawn = [];

let lastDrawn = [];


/* =========================================================
   MÉLANGE
   ========================================================= */

function shuffle(array) {

    const newArray = [...array];

    for (let i = newArray.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [newArray[i], newArray[j]] =
        [newArray[j], newArray[i]];

    }

    return newArray;
}


/* =========================================================
   NOUVELLE PARTIE
   ========================================================= */

function resetGame() {

    deck = shuffle(cards);

    drawn = [];

    lastDrawn = [];

    document.getElementById("cards").style.display = "none";

    document.getElementById("returnBtn").disabled = true;

    updateDisplay();

}


/* =========================================================
   MISE À JOUR DES COMPTEURS
   ========================================================= */

function updateDisplay() {

    document.getElementById("remaining").textContent =
        deck.length;

    document.getElementById("drawn").textContent =
        drawn.length;


    const history =
        document.getElementById("historyList");


    if (drawn.length === 0) {

        history.className = "empty";

        history.textContent =
            "Aucune carte tirée.";

        return;

    }


    history.className = "";


    history.innerHTML =
        "<ol>" +

        drawn.map(card => {

            return `
                <li>
                    ${escapeHTML(card.title)}
                    —
                    ${escapeHTML(card.cat)}
                </li>
            `;

        }).join("") +

        "</ol>";

}


/* =========================================================
   PROTECTION HTML
   ========================================================= */

function escapeHTML(text) {

    return text.replace(/[&<>"']/g, function(char) {

        return {

            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"

        }[char];

    });

}


/* =========================================================
   AFFICHAGE DES CARTES
   ========================================================= */

function displayCards(cardsToDisplay) {

    const container =
        document.getElementById("cards");


    container.innerHTML = "";


    cardsToDisplay.forEach((card, index) => {

        const element =
            document.createElement("div");


        element.className = "card";


        element.style.animationDelay =
            (index * 0.1) + "s";


        element.innerHTML = `

            <div class="category ${card.cls}">
                ${escapeHTML(card.cat)}
            </div>

            <h2 class="card-title">
                ${escapeHTML(card.title)}
            </h2>

            <div class="effect">
                ${escapeHTML(card.text)}
            </div>

        `;


        container.appendChild(element);

    });


    container.style.display = "grid";

}


/* =========================================================
   TIRER UNE CARTE
   ========================================================= */

function drawOneCard() {

    if (deck.length === 0) {

        alert(
            "La pioche est vide ! Lance une nouvelle partie."
        );

        return;

    }


    const card = deck.pop();


    drawn.push(card);

    lastDrawn = [card];


    displayCards([card]);


    document.getElementById("returnBtn")
        .disabled = false;


    updateDisplay();

}


/* =========================================================
   TIRER 3 CARTES
   ========================================================= */

function drawThreeCards() {

    if (deck.length < 3) {

        alert(
            "Il ne reste pas assez de cartes pour tirer 3 cartes."
        );

        return;

    }


    const threeCards = [];


    for (let i = 0; i < 3; i++) {

        const card = deck.pop();

        threeCards.push(card);

        drawn.push(card);

    }


    lastDrawn = threeCards;


    displayCards(threeCards);


    document.getElementById("returnBtn")
        .disabled = false;


    updateDisplay();

}


/* =========================================================
   REMETTRE LES DERNIÈRES CARTES
   ========================================================= */

function returnLastCards() {

    if (lastDrawn.length === 0) {

        return;

    }


    lastDrawn.forEach(card => {

        const index =
            drawn.lastIndexOf(card);


        if (index !== -1) {

            drawn.splice(index, 1);

        }


        deck.push(card);

    });


    deck = shuffle(deck);


    lastDrawn = [];


    document.getElementById("cards")
        .style.display = "none";


    document.getElementById("returnBtn")
        .disabled = true;


    updateDisplay();

}


/* =========================================================
   BOUTONS
   ========================================================= */

document
    .getElementById("drawBtn")
    .addEventListener(
        "click",
        drawOneCard
    );
